name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python 3.11 syntax floor
        run: |
          python3 scripts/check_py311.py --selftest && python3 scripts/check_py311.py
      - name: Run tests
        run: |
          cd scripts && python3 test_measure_tokens.py && python3 test_reconcile.py && python3 test_tools.py && python3 test_pricing.py && python3 test_experiment.py && python3 test_guided_apply.py && python3 test_optimize.py && python3 test_plugin_prune.py && python3 test_memory_trim.py && python3 test_profile.py && python3 test_advisor.py && python3 test_report.py && python3 test_detail_report.py && python3 test_discover_companions.py && python3 test_doctor.py && python3 test_companions.py && python3 test_deep_advisor.py && python3 test_share_card.py && python3 test_signals.py
      - name: Run the bench self-check and benchmark
        run: |
          python3 bench/test_bench.py && python3 bench/generate_corpus.py --out /tmp/bench-corpus && python3 bench/run_benchmark.py --corpus /tmp/bench-corpus
      - name: Install the MCP server package
        run: |
          python3 -m pip install ./mcp-server
      - name: Run the MCP server tests
        run: |
          cd mcp-server && python3 test_mcp_server.py
